<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key DM - Gmail Sync</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        :root { --bg: #000; --card: #121212; --accent: #d4af37; --text: #fff; --border: #222; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 480px; margin: auto; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 20px; }
        #siteLogo { width: 90px; height: 90px; border-radius: 15px; border: 2px solid var(--accent); object-fit: cover; }
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid var(--border); border-radius: 12px; background: #080808; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .post-card { background: #0a0a0a; padding: 15px; margin-top: 15px; border-radius: 12px; border-left: 5px solid var(--accent); }
        .admin-box { display: none; background: #050505; padding: 20px; border-radius: 15px; border: 1px dashed var(--accent); margin-top: 20px; }
        .status-msg { font-size: 12px; text-align: center; margin-top: 5px; color: #28a745; display: none; }
        .admin-trigger { text-align: center; margin-top: 30px; color: #222; cursor: pointer; font-size: 11px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img id="siteLogo" src="logo.png" alt="Key DM" onerror="this.src='https://via.placeholder.com/90/d4af37/000?text=KEY'">
        <h1 style="color:var(--accent); margin:10px 0;">Key DM</h1>
        <p style="font-size: 12px; color: #888;">📧 grensrena@gmail.com</p>
    </div>

    <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Shakisha...">
    <div id="searchResults"></div>

    <p class="admin-trigger" onclick="document.getElementById('loginForm').classList.toggle('hidden')">ADMIN SETTINGS</p>
    
    <div id="loginForm" class="hidden">
        <input type="password" id="adminPass" placeholder="Password (123)">
        <button onclick="checkLogin()">Injira</button>
    </div>

    <div id="adminPanel" class="admin-box">
        <h3 style="color:var(--accent); text-align:center;">Email Notification Active</h3>
        <input type="text" id="postTitle" placeholder="Title y'ubutumwa">
        <textarea id="postContent" rows="3" placeholder="Ibisobanuro..."></textarea>
        <button id="publishBtn" onclick="saveAndSend()">Tangaza & Ohereza kuri Gmail</button>
        <p id="status" class="status-msg">Ubutumwa bwoherejwe kuri Gmail!</p>
        
        <button onclick="location.reload()" style="background:#444; color:#fff; margin-top:15px;">Logout</button>
    </div>
</div>

<script>
    // 1. INITIALIZE EMAILJS (Gira kuri emailjs.com uhafurure 'Public Key' yawe)
    (function() {
        emailjs.init("YOUR_PUBLIC_KEY_HERE"); 
    })();

    let db = JSON.parse(localStorage.getItem('keyDm_Gmail')) || { password: "123", posts: [] };

    function checkLogin() {
        if(document.getElementById('adminPass').value === db.password) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginForm').classList.add('hidden');
        } else { alert("Password siyo!"); }
    }

    // GUKORA POST NO KOHEREZA EMAIL
    function saveAndSend() {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        const btn = document.getElementById('publishBtn');

        if(title && content) {
            btn.innerText = "Sending...";
            btn.disabled = true;

            // Ohereza kuri Gmail binyuze kuri EmailJS
            const templateParams = {
                to_email: "grensrena@gmail.com",
                subject: "Key DM New Post: " + title,
                message: content
            };

            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function() {
                    db.posts.push({ title, content });
                    localStorage.setItem('keyDm_Gmail', JSON.stringify(db));
                    displayPosts();
                    
                    document.getElementById('status').style.display = 'block';
                    btn.innerText = "Tangaza & Ohereza kuri Gmail";
                    btn.disabled = false;
                    
                    document.getElementById('postTitle').value = "";
                    document.getElementById('postContent').value = "";
                }, function(error) {
                    alert("Email ntabwo igiye: " + JSON.stringify(error));
                    btn.disabled = false;
                });
        }
    }

    function displayPosts(filter = "") {
        const div = document.getElementById('searchResults');
        div.innerHTML = "";
        const filtered = db.posts.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()));
        filtered.forEach(post => {
            div.innerHTML += `<div class="post-card"><h3>${post.title}</h3><p>${post.content}</p></div>`;
        });
    }

    function searchPosts() { displayPosts(document.getElementById('searchInput').value); }
    displayPosts();
</script>
</body>
</html>
