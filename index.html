<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key DM - Yohereza Ubutumwa</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dm-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { color: #333; text-align: center; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="dm-container">
    <h2>Key DM</h2>
    <form action="https://formspree.io/f/grensren@gmail.com" method="POST">
        <label>Izina ryawe:</label>
        <input type="text" name="name" placeholder="Andika izina..." required>
        
        <label>Email yawe:</label>
        <input type="email" name="_replyto" placeholder="Email yawe..." required>
        
        <label>Ubutumwa:</label>
        <textarea name="message" rows="4" placeholder="Andika ubutumwa hano..." required></textarea>
        
        <button type="submit">Ohereza DM</button>
    </form>
</div>

</body>
</html>
