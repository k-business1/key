<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key DM - Dark Edition</title>
    <style>
        :root { 
            --bg: #000000; 
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --accent: #d4af37; 
            --border: #333;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            margin: 0; padding: 20px; 
        }

        .container { 
            max-width: 500px; margin: auto; 
            background: var(--card-bg); 
            padding: 30px; border-radius: 15px; 
            border: 1px solid var(--border);
        }

        /* Logo nk'Icon (Square with slight radius) */
        .header-area { text-align: center; margin-bottom: 20px; }
        #siteLogo { 
            width: 80px; height: 80px; 
            border-radius: 12px; /* Remove cycle, make it an icon */
            object-fit: cover; 
            border: 2px solid var(--accent);
        }

        h1 { font-size: 24px; margin: 10px 0; color: var(--accent); }

        /* Contact Section */
        .contact-info { 
            font-size: 14px; color: #bbb; text-align: center; 
            margin-bottom: 20px; border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        input, textarea { 
            width: 100%; padding: 12px; margin: 10px 0; 
            border: 1px solid var(--border); border-radius: 8px; 
            background: #222; color: #fff; box-sizing: border-box; 
        }
        
        button { 
            width: 100%; padding: 12px; background: var(--accent); color: #000; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; 
        }

        .post-card { 
            background: #111; padding: 15px; margin-top: 15px; 
            border-radius: 10px; border: 1px solid var(--border);
        }

        .dm-btn { 
            background: #28a745; color: white; text-decoration: none; 
            display: block; text-align: center; padding: 10px; 
            border-radius: 5px; margin-top: 10px; font-weight: bold; 
        }

        .admin-box { 
            display: none; background: #0a0a0a; padding: 20px; 
            border-radius: 12px; border: 1px dashed var(--accent); margin-top: 20px; 
        }

        .login-trigger { text-align: center; margin-top: 20px; color: #555; cursor: pointer; font-size: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <img id="siteLogo" src="" alt="Icon">
        <h1>Key DM</h1>
    </div>

    <div class="contact-info">
        <p>📞 07896952187 | 📧 grensrena@gmail.com</p>
    </div>

    <div id="userSection">
        <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Shakisha muri Key DM...">
        <div id="searchResults"></div>
    </div>

    <p class="login-trigger" onclick="document.getElementById('loginForm').classList.toggle('hidden')">Admin Portal</p>

    <div id="loginForm" class="hidden">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="checkLogin()">Injira</button>
    </div>

    <div id="adminPanel" class="admin-box">
        <h3 style="color:var(--accent)">Admin Settings</h3>
        
        <label>Upload Icon Logo:</label>
        <input type="file" id="logoUpload" accept="image/*" onchange="uploadLogo()">
        
        <label>Change Password:</label>
        <input type="text" id="newPass" placeholder="Password nshya">
        <button onclick="changePassword()" style="background:#444; color:white;">Save Password</button>
        
        <hr style="border:0.5px solid #333; margin:20px 0;">
        
        <label>New Post:</label>
        <input type="text" id="postTitle" placeholder="Title">
        <textarea id="postContent" rows="3" placeholder="Ibisobanuro..."></textarea>
        <button onclick="savePost()">Publish</button>
        
        <button onclick="logout()" style="background:#900; color:white; margin-top:20px;">Logout</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('keyDmDB_Black')) || {
        password: "123",
        logo: "https://via.placeholder.com/80/d4af37/000000?text=K",
        posts: []
    };

    function init() {
        document.getElementById('siteLogo').src = db.logo;
        displayPosts();
    }

    function checkLogin() {
        if(document.getElementById('adminPass').value === db.password) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginForm').classList.add('hidden');
        } else { alert("Password siyo!"); }
    }

    function uploadLogo() {
        const file = document.getElementById('logoUpload').files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            db.logo = reader.result;
            saveDB();
            document.getElementById('siteLogo').src = db.logo;
        }
        if (file) reader.readAsDataURL(file);
    }

    function changePassword() {
        const newP = document.getElementById('newPass').value;
        if(newP) {
            db.password = newP;
            saveDB();
            alert("Password yahindutse!");
            document.getElementById('newPass').value = "";
        }
    }

    function savePost() {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        if(title && content) {
            db.posts.push({ title, content });
            saveDB();
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
            displayPosts();
        }
    }

    function displayPosts(filter = "") {
        const div = document.getElementById('searchResults');
        div.innerHTML = "";
        const filtered = db.posts.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()));
        
        filtered.forEach(post => {
            div.innerHTML += `
                <div class="post-card">
                    <h3 style="margin:0; color:var(--accent)">${post.title}</h3>
                    <p style="color:#ccc; font-size:14px;">${post.content}</p>
                    <a href="mailto:grensrena@gmail.com?subject=KeyDM: ${post.title}" class="dm-btn">Ohereza DM</a>
                </div>
            `;
        });
    }

    function searchPosts() { displayPosts(document.getElementById('searchInput').value); }
    function saveDB() { localStorage.setItem('keyDmDB_Black', JSON.stringify(db)); }
    function logout() { document.getElementById('adminPanel').style.display = 'none'; }

    init();
</script>

</body>
</html>
