<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key DM - Official Website</title>
    <style>
        :root { 
            --bg: #000000; 
            --card: #111111; 
            --accent: #d4af37; 
            --text: #ffffff; 
            --border: #222;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; line-height: 1.6;
        }

        .container { 
            max-width: 500px; margin: auto; 
            background: var(--card); padding: 30px; 
            border-radius: 20px; border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* Logo Icon Style */
        .header { text-align: center; margin-bottom: 20px; }
        #siteLogo { 
            width: 90px; height: 90px; 
            border-radius: 20px; 
            border: 2px solid var(--accent); 
            object-fit: cover; background: #000;
        }

        h1 { color: var(--accent); margin: 10px 0; font-size: 28px; }

        /* Introduction Section */
        .intro-box {
            background: #080808; padding: 15px;
            border-radius: 12px; border: 1px solid #1a1a1a;
            margin-bottom: 25px; text-align: center;
        }
        .intro-box p { font-size: 14px; color: #aaa; margin: 0; }

        /* Contact Section */
        .contact-info { 
            background: var(--accent); color: #000;
            padding: 15px; border-radius: 12px;
            text-align: center; font-weight: bold; margin-bottom: 25px;
        }
        .contact-info a { color: #000; text-decoration: none; }

        input, textarea { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border: 1px solid var(--border); border-radius: 12px; 
            background: #000; color: #fff; box-sizing: border-box; 
        }
        
        button { 
            width: 100%; padding: 14px; background: var(--accent); color: #000; 
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold; 
        }

        .post-card { 
            background: #080808; padding: 18px; margin-top: 15px; 
            border-radius: 15px; border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
        }

        .admin-box { 
            display: none; background: #050505; padding: 20px; 
            border-radius: 15px; border: 1px dashed var(--accent); margin-top: 25px; 
        }

        .admin-trigger { text-align: center; margin-top: 40px; color: #222; cursor: pointer; font-size: 11px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img id="siteLogo" src="" alt="Icon" onerror="this.src='https://via.placeholder.com/90/d4af37/000?text=KEY'">
        <h1>Key DM</h1>
    </div>

    <div class="intro-box">
        <h3 style="color: var(--accent); margin-top:0;">Ikaze kuri Key DM</h3>
        <p>Key DM ni urubuga rugufasha kugezwaho amakuru agezweho, ibiciro, n'itumanaho ryoroshye. Twiyemeje kuguha serivisi nziza kandi zihuse binyuze mu buryo bw'ikoranabuhanga rigezweho.</p>
    </div>

    <div class="contact-info">
        <span>📞 <a href="tel:0796952187">0796952187</a></span> | 
        <span>📧 <a href="mailto:grensrena@gmail.com">grensrena@gmail.com</a></span>
    </div>

    <div id="userSection">
        <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Shakisha ikintu...">
        <div id="searchResults"></div>
    </div>

    <p class="admin-trigger" onclick="document.getElementById('loginForm').classList.toggle('hidden')">ADMIN SETTINGS</p>
    
    <div id="loginForm" class="hidden">
        <input type="password" id="adminPass" placeholder="Injiza Password (123)">
        <button onclick="checkLogin()">Injira</button>
    </div>

    <div id="adminPanel" class="admin-box">
        <h3 style="text-align: center; color: var(--accent);">Admin Panel</h3>
        <label style="font-size:11px;">Update Logo:</label>
        <input type="file" id="logoUpload" accept="image/*" onchange="uploadLogo()">
        
        <hr style="border:0.5px solid #222; margin:15px 0;">
        <input type="text" id="postTitle" placeholder="Umutwe w'ubutumwa">
        <textarea id="postContent" rows="3" placeholder="Ibisobanuro..."></textarea>
        <button onclick="saveAndMail()">Publish & Send to Gmail</button>
        
        <button onclick="location.reload()" style="background:#444; color:white; margin-top:15px;">Logout</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('keyDm_Final_V4')) || {
        password: "123",
        logo: "",
        posts: []
    };

    function init() {
        if(db.logo) document.getElementById('siteLogo').src = db.logo;
        displayPosts();
    }

    function checkLogin() {
        if(document.getElementById('adminPass').value === db.password) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginForm').classList.add('hidden');
        } else { alert("Password siyo!"); }
    }

    function uploadLogo() {
        const file = document.getElementById('logoUpload').files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            db.logo = reader.result;
            document.getElementById('siteLogo').src = db.logo;
            saveDB();
        }
        if (file) reader.readAsDataURL(file);
    }

    function saveAndMail() {
        const t = document.getElementById('postTitle').value;
        const c = document.getElementById('postContent').value;
        
        if(t && c) {
            // Kubika muri Web
            db.posts.push({ title: t, content: c });
            saveDB();
            displayPosts();

            // Kohereza kuri Gmail (Byikora)
            const mailLink = `mailto:grensrena@gmail.com?subject=New KeyDM Post: ${t}&body=${c}`;
            window.location.href = mailLink;

            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
        }
    }

    function displayPosts(filter = "") {
        const div = document.getElementById('searchResults');
        div.innerHTML = "";
        const filtered = db.posts.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()));
        filtered.forEach(post => {
            div.innerHTML += `<div class="post-card"><h3 style="margin:0; color:var(--accent)">${post.title}</h3><p>${post.content}</p></div>`;
        });
    }

    function searchPosts() { displayPosts(document.getElementById('searchInput').value); }
    function saveDB() { localStorage.setItem('keyDm_Final_V4', JSON.stringify(db)); }

    init();
</script>
</body>
</html>
