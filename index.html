<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key DM - Static Generator</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #d4af37; --text: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 480px; margin: auto; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #222; }
        .header { text-align: center; margin-bottom: 20px; }
        #siteLogo { width: 85px; height: 85px; border-radius: 15px; border: 2px solid var(--accent); object-fit: cover; }
        .contact { font-size: 13px; color: #888; text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; border-radius: 10px; background: #000; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent); color: #00; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .post-card { background: #080808; padding: 15px; margin-top: 15px; border-radius: 12px; border: 1px solid #222; border-left: 4px solid var(--accent); }
        .admin-box { display: none; background: #050505; padding: 20px; border-radius: 15px; border: 1px dashed var(--accent); margin-top: 20px; }
        .export-area { background: #111; color: #0f0; font-family: monospace; padding: 10px; font-size: 10px; height: 100px; overflow-y: scroll; margin-top: 10px; border: 1px solid #333; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="web-content">
    <div class="header">
        <img id="siteLogo" src="https://via.placeholder.com/85/d4af37/000?text=KEY" alt="Icon">
        <h1 style="color:var(--accent); margin:10px 0;">Key DM</h1>
    </div>

    <div class="contact">
        📞 07896952187 | 📧 grensrena@gmail.com
    </div>

    <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Shakisha ikintu...">
    
    <div id="searchResults">
        </div>

    <p style="text-align:center; color:#222; font-size:10px; cursor:pointer;" onclick="document.getElementById('loginForm').classList.toggle('hidden')">SETTINGS</p>
    
    <div id="loginForm" class="hidden">
        <input type="password" id="adminPass" placeholder="Password (123)">
        <button onclick="checkLogin()">Injira</button>
    </div>

    <div id="adminPanel" class="admin-box">
        <h3 style="color:var(--accent); text-align:center;">Admin Editor</h3>
        <input type="text" id="postTitle" placeholder="Izina (Title)">
        <textarea id="postContent" rows="3" placeholder="Ibisobanuro..."></textarea>
        <button onclick="savePost()">Add Post</button>
        
        <hr style="border:1px solid #222; margin:20px 0;">
        <p style="font-size:11px; color:var(--accent)">Kopiye iyi code uyishyire muri file yawe (.html) kugira ngo ihinduke burundu:</p>
        <button onclick="exportCode()" style="background:#28a745; color:white;">Generate Full Code</button>
        <div id="codeDisplay" class="export-area hidden"></div>
        
        <button onclick="location.reload()" style="background:#600; color:white; margin-top:20px;">Logout</button>
    </div>
</div>

<script>
    // Database
    let db = JSON.parse(localStorage.getItem('keyDm_Final')) || { password: "123", posts: [] };

    function checkLogin() {
        if(document.getElementById('adminPass').value === db.password) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginForm').classList.add('hidden');
        } else { alert("Password siyo!"); }
    }

    function savePost() {
        const t = document.getElementById('postTitle').value;
        const c = document.getElementById('postContent').value;
        if(t && c) {
            db.posts.push({ title: t, content: c });
            localStorage.setItem('keyDm_Final', JSON.stringify(db));
            displayPosts();
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
        }
    }

    function displayPosts(filter = "") {
        const div = document.getElementById('searchResults');
        div.innerHTML = "";
        const filtered = db.posts.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()));
        filtered.forEach(post => {
            div.innerHTML += `<div class="post-card"><h3>${post.title}</h3><p>${post.content}</p></div>`;
        });
    }

    function searchPosts() { displayPosts(document.getElementById('searchInput').value); }

    // Iyi niyo function ikora "Magic" urashaka
    function exportCode() {
        const postsHTML = document.getElementById('searchResults').innerHTML;
        const fullCode = document.documentElement.outerHTML;
        const display = document.getElementById('codeDisplay');
        display.classList.remove('hidden');
        display.innerText = fullCode;
        alert("Code nshya yabonetse munsi! Kopiye byose ubisimbure muri file yawe.");
    }

    displayPosts();
</script>
</body>
</html>
