<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key DM - Premium Admin</title>
    <style>
        :root { 
            --primary: #1a1a1a; 
            --accent: #d4af37; 
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 550px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Logo Styling */
        .header-area { text-align: center; margin-bottom: 20px; }
        #siteLogo { 
            width: 120px; height: 120px; border-radius: 50%; 
            object-fit: cover; border: 3px solid var(--accent); padding: 5px; 
        }

        h1 { text-align: center; color: var(--primary); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        
        button { 
            width: 100%; padding: 12px; background: var(--primary); color: white; 
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 5px;
        }
        button:hover { background: var(--accent); }

        .admin-box { display: none; background: #fff9e6; padding: 20px; border-radius: 12px; border: 1px dashed var(--accent); margin-top: 20px; }
        .post-card { background: white; padding: 15px; margin-top: 15px; border-radius: 12px; border-left: 5px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .contact-btn { background: #27ae60; color: white; text-decoration: none; display: block; text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; }
        .login-trigger { text-align: center; margin-top: 20px; color: #888; cursor: pointer; text-decoration: underline; font-size: 13px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <img id="siteLogo" src="" alt="Key DM Logo">
        <h1>Key DM</h1>
    </div>

    <div id="userSection">
        <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Shakisha muri Key DM...">
        <div id="searchResults"></div>
    </div>

    <p class="login-trigger" onclick="document.getElementById('loginForm').classList.toggle('hidden')">Admin Access</p>

    <div id="loginForm" class="hidden">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="checkLogin()">Injira</button>
    </div>

    <div id="adminPanel" class="admin-box">
        <h3 style="text-align:center;">Admin Settings</h3>
        
        <label>Hindura Logo:</label>
        <input type="file" id="logoUpload" accept="image/*" onchange="uploadLogo()">
        
        <hr>
        <label>Hindura Password:</label>
        <input type="text" id="newPass" placeholder="Andika Password nshya">
        <button onclick="changePassword()" style="background:#555;">Update Password</button>
        
        <hr>
        <label>Tangaza Ikintu (Post):</label>
        <input type="text" id="postTitle" placeholder="Title">
        <textarea id="postContent" rows="3" placeholder="Ibisobanuro..."></textarea>
        <button onclick="savePost()">Publish Post</button>
        
        <button onclick="logout()" style="background:#e74c3c; margin-top:20px;">Sohoka</button>
    </div>
</div>

<script>
    // --- DATABASE MURI BROWSER ---
    let db = JSON.parse(localStorage.getItem('keyDmDB')) || {
        password: "123",
        logo: "https://via.placeholder.com/120?text=Key+DM",
        posts: []
    };

    // --- INITIALIZE PAGE ---
    function init() {
        document.getElementById('siteLogo').src = db.logo;
        displayPosts();
    }

    // --- ADMIN LOGICS ---
    function checkLogin() {
        const pass = document.getElementById('adminPass').value;
        if(pass === db.password) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginForm').classList.add('hidden');
        } else {
            alert("Password siyo!");
        }
    }

    function uploadLogo() {
        const file = document.getElementById('logoUpload').files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            db.logo = reader.result;
            saveDB();
            document.getElementById('siteLogo').src = db.logo;
            alert("Logo yahindutse!");
        }
        if (file) reader.readAsDataURL(file);
    }

    function changePassword() {
        const newP = document.getElementById('newPass').value;
        if(newP) {
            db.password = newP;
            saveDB();
            alert("Password yahindutse: " + newP);
            document.getElementById('newPass').value = "";
        }
    }

    function savePost() {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        if(title && content) {
            db.posts.push({ title, content });
            saveDB();
            alert("Byagiyeho!");
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
            displayPosts();
        }
    }

    // --- USER LOGICS ---
    function displayPosts(filter = "") {
        const div = document.getElementById('searchResults');
        div.innerHTML = "";
        const filtered = db.posts.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()));
        
        filtered.forEach(post => {
            div.innerHTML += `
                <div class="post-card">
                    <h3 style="margin:0;">${post.title}</h3>
                    <p style="color:#666;">${post.content}</p>
                    <a href="mailto:grensren@gmail.com?subject=KeyDM: ${post.title}" class="contact-btn">Ohereza DM</a>
                </div>
            `;
        });
    }

    function searchPosts() {
        displayPosts(document.getElementById('searchInput').value);
    }

    function saveDB() {
        localStorage.setItem('keyDmDB', JSON.stringify(db));
    }

    function logout() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('adminPass').value = "";
    }

    init();
</script>

</body>
</html>
