<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key DM - Admin & Search</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: var(--primary); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--accent); }
        .post-card { background: #fff; border: 1px solid #eee; padding: 15px; margin-top: 15px; border-radius: 10px; border-left: 5px solid var(--accent); }
        .admin-section { display: none; background: #f9f9f9; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px dashed #ccc; }
        .contact-btn { background: #27ae60; margin-top: 10px; text-decoration: none; color: white; display: block; text-align: center; padding: 10px; border-radius: 8px; }
        .hidden { display: none; }
        .login-link { cursor: pointer; color: blue; font-size: 12px; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>Key DM</h1>

    <div id="userSection">
        <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Shakisha amakuru hano...">
        <div id="searchResults"></div>
    </div>

    <hr>
    <p class="login-link" onclick="toggleLogin()">Admin Login</p>

    <div id="loginForm" class="hidden">
        <input type="password" id="adminPass" placeholder="Injiza Password ya Admin">
        <button onclick="checkLogin()">Injira</button>
    </div>

    <div id="adminPanel" class="admin-section">
        <h2>Admin Panel</h2>
        <input type="text" id="postTitle" placeholder="Izina ry'ikintu (Title)">
        <textarea id="postContent" rows="4" placeholder="Andika amakuru hano..."></textarea>
        <button onclick="savePost()">Post & Update Website</button>
        <button onclick="logout()" style="background: #e74c3c; margin-top: 5px;">Logout</button>
    </div>
</div>

<script>
    // 1. Password ya Admin (Cyangwa wayihindura hano)
    const ADMIN_PASSWORD = "123"; 

    // 2. Kuzana ibyabitswe
    let posts = JSON.parse(localStorage.getItem('keyDmData')) || [];

    function displayPosts(filter = "") {
        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = "";
        
        const filtered = posts.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()));

        filtered.forEach(post => {
            resultsDiv.innerHTML += `
                <div class="post-card">
                    <h3>${post.title}</h3>
                    <p>${post.content}</p>
                    <a href="mailto:grensren@gmail.com?subject=Contact via Key DM: ${post.title}" class="contact-btn">Contact Us</a>
                </div>
            `;
        });
        
        if(filtered.length === 0 && filter !== "") {
            resultsDiv.innerHTML = "<p style='text-align:center'>Ntabwo bibonetse...</p>";
        }
    }

    // 3. Admin Functions
    function toggleLogin() {
        document.getElementById('loginForm').classList.toggle('hidden');
    }

    function checkLogin() {
        const pass = document.getElementById('adminPass').value;
        if(pass === ADMIN_PASSWORD) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginForm').classList.add('hidden');
        } else {
            alert("Password si yo!");
        }
    }

    function savePost() {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;

        if(title && content) {
            posts.push({ title, content });
            localStorage.setItem('keyDmData', JSON.stringify(posts));
            alert("Byamaze kujyaho!");
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
            displayPosts();
        }
    }

    function logout() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('adminPass').value = "";
    }

    // 4. Search Function
    function searchPosts() {
        const term = document.getElementById('searchInput').value;
        displayPosts(term);
    }

    // Tangira ugaragaza ibirimo
    displayPosts();
</script>

</body>
</html>
